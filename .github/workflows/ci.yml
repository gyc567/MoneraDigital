name: CI

# Green gate for build + vet + tests. Runs on every push/PR to the three
# long-lived branches. Pre-existing baseline tech-debt packages are excluded
# (documented inline) so this job stays green and catches new regressions —
# including migration-ceiling drift the deploy workflows cannot detect.
on:
  push:
    branches: [dev, stage, main]
  pull_request:
    branches: [dev, stage, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: monera_digital_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monera_digital_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pin 1.25 rather than go-version-file: go.mod (1.24.0). The
          # releasecontrol checkpoint + cmd/company-fund-release tests rebuild
          # the controlled-migration archive whose go.mod requires >= 1.25,
          # and the subprocess inherits GOTOOLCHAIN=local from setup-go, so CI
          # must ship a matching local toolchain. Deploy workflows build the
          # live tree with the auto toolchain and are unaffected.
          go-version: '1.25'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: routing alert PostgreSQL queue behavior
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/monera_digital_ci?sslmode=disable
          RUN_FUND_ROUTING_QUEUE_POSTGRES_INTEGRATION: "1"
        run: go test -race -count=1 ./internal/fundrouting -run '^TestRoutingAlertQueuePostgres'
      - name: routing SLA PostgreSQL behavior
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/monera_digital_ci?sslmode=disable
          RUN_FUND_ROUTING_POSTGRES_INTEGRATION: "1"
        run: >-
          go test -race -count=1 ./internal/fundrouting
          -run '^Test(AlertEscalatorSQLPostgres|StatusRecoverySQLPostgres)'
      - name: auth PostgreSQL integration behavior
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/monera_digital_ci?sslmode=disable
          RUN_AUTH_POSTGRES_INTEGRATION: "1"
        run: go test -race -count=1 ./tests
      - name: go test (green gate; baseline tech-debt excluded)
        run: |
          # Packages excluded from the green gate until their pre-existing
          # baseline failures are resolved (independent of this change):
          #   internal/scheduler — stale testify mock signature (CreateWithDate drift)
          # Remove an exclusion line the moment that package goes green, so CI
          # widens its coverage automatically.
          mapfile -t pkgs < <(go list ./... | grep -vE 'internal/scheduler$')
          go test -race -count=1 "${pkgs[@]}"
